<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - Dashmesh Foundation</title>
    <meta name="description" content="Contact Dashmesh Institute of Skill Development Foundation" />
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="./dashmeshskill.png" type="image/x-icon">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="site-wrapper">
        <header-component></header-component>


        <div class="page-banner">
            <div class="container-custom">
                <h1 class="page-banner-title">CONTACT US</h1>
                <div class="breadcrumbs">
                    <a href="index.html" class="breadcrumb-link">Home</a>
                    <span>›</span>
                    <span>Contact Us</span>
                </div>
            </div>
        </div>

        <section class="main-content contact-page-section">
            <div class="container-custom">
                <div class="contact-grid">

                    <div class="contact-form-container">
                        <h2 class="section-title mb-8">Leave A Message Here</h2>
                        <p class="text-gray mb-6">
                            Write your query here for further assistance
                        </p>

                        <form id="contact-form" class="contact-form">
                            <div class="form-row-grid">
                                <div>
                                    <input type="text" name="name" placeholder="Name" class="form-input" required />
                                </div>
                                <div>
                                    <input type="email" name="email" placeholder="Email" class="form-input" required />
                                </div>
                            </div>

                            <div class="form-row-grid">
                                <div>
                                    <input type="tel" name="phone" placeholder="Phone Number" class="form-input"
                                        required />
                                </div>
                                <div>
                                    <input type="text" name="subject" placeholder="Subject" class="form-input"
                                        required />
                                </div>
                            </div>

                            <div>
                                <textarea name="message" placeholder="Message" class="form-textarea"
                                    required></textarea>
                            </div>

                            <div>
                                <button type="submit" class="btn-primary">
                                    Send Message
                                </button>
                            </div>
                        </form>
                    </div>

                    <div class="contact-details-container">
                        <h2 class="section-title mb-8">Contact Details</h2>

                        <div class="contact-details-list">
                            <div class="contact-info-item">
                                <div class="contact-icon-wrapper">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                                        <circle cx="12" cy="10" r="3"></circle>
                                    </svg>
                                </div>
                                <div class="contact-info-text">
                                    <h4>Our Locations</h4>
                                    <p class="text-gray">Amritsar, Punjab, India</p>
                                    <p class="text-gray">Mohali, Punjab, India</p>
                                </div>
                            </div>

                            <div class="contact-info-item">
                                <div class="contact-icon-wrapper">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <path
                                            d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z">
                                        </path>
                                        <polyline points="22,6 12,13 2,6"></polyline>
                                    </svg>
                                </div>
                                <div class="contact-info-text">
                                    <h4>Email Address</h4>
                                    <p class="text-gray">support@dashmeshskill.com</p>
                                </div>
                            </div>

                            <div class="contact-info-item">
                                <div class="contact-icon-wrapper">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <circle cx="12" cy="12" r="10"></circle>
                                        <polyline points="12 6 12 12 16 14"></polyline>
                                    </svg>
                                </div>
                                <div class="contact-info-text">
                                    <h4>Working Hours</h4>
                                    <p class="text-gray">Mon - Sat 10.00 - 18.00</p>
                                </div>
                            </div>
                        </div>

                        <div class="map-container">
                            <iframe
                                src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d219565.69831443898!2d76.69738!3d30.698321!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x390fee906da6f81f%3A0x512998f16ce508d8!2sSahibzada%20Ajit%20Singh%20Nagar%2C%20Punjab!5e0!3m2!1sen!2sin!4v1746262557026!5m2!1sen!2sin"
                                width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                                referrerpolicy="no-referrer-when-downgrade"></iframe>
                        </div>
                    </div>
                </div>
            </div>
        </section>


        <footer-component></footer-component>
    </div>
    <script src="./header.js"></script>
    <script src="./footer.js"></script>
</body>

</html>
